<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXTONY</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    color:white;
}

/* Cabeçalho */

header{
    background:#000;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    .logo{}
    color: #6412cf;
    font-size: 60px;
    letter-spacing: 8px;
    text-shadow: 0 0 10px #9b4dff,
                 0 0 20px #9b4dff,
                 0 0 40px #6d28d9;
    transition: 0.3s;
}

.logo:hover{
    transform: scale(1.08);
    color: #822fd4;
}
}

.menu a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    transition:.3s;
}

.menu a:hover{
    color:#e254ef;
}

/* Banner */

.banner{
    width:100%;
    height:500px;
    overflow:hidden;
}

.banner img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Catálogo */

h2{
    margin:30px;
    font-size:30px;
}

.catalogo{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    padding:20px;
}

.card{
    width:250px;
    transition:.4s;
}

.card img{
    width:100%;
    height:350px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.6);
}

.card:hover{
    transform:scale(1.08);
}

.card p{
    margin-top:10px;
    text-align:center;
    font-size:20px;
    color:white;
}

.card a{
    text-decoration:none;
}

footer{
    margin:40px;
    text-align:center;
    color:#aaa;
}

</style>

</head>

<body>

<header>

    <div class="logo">AXTONY</div>

    <nav class="menu">
        <a href="#">Início</a>
        <a href="#">Catálogo</a>
        <a href="#">Favoritos</a>
    </nav>

</header>

<div class="banner">

    <a href="https://youtu.be/rnqEzTwdY4U?si=sHx66vMVLTJmlQmm" target="_blank">
        <img src="south park.jpg" alt="South Park">
    </a>

</div>

<h2>Catálogo</h2>

<div class="catalogo">

    <div class="card">
        <a href="https://youtu.be/rnqEzTwdY4U?si=sHx66vMVLTJmlQmm" target="_blank">
            <img src="south park.jpg" alt="South Park">
            <p>South Park</p>
        </a>
    </div>

    <div class="card">
        <a href="https://youtu.be/PTXQg0lg6Q0?si=uhnunzn5c9iDvc5m" target="_blank">
            <img src="my little pony.jpg" alt="My Little Pony">
            <p>My Little Pony</p>
        </a>
    </div>

    <div class="card">
        <a href="https://youtu.be/CMaOLE_SxRE?si=-HckukPUuqKvlAFj" target="_blank">
            <img src="Gumball.jpg" alt="Gumball">
            <p>O Incrível Mundo de Gumball</p>
        </a>
    </div>

    <div class="card">
        <a href="https://youtu.be/AQl4maJU8Ck?si=f65iZHXTbwqfpf_r" target="_blank">
            <img src="Ursos Sem Curso.jpg" alt="Ursos Sem Curso">
            <p>Ursos Sem Curso</p>
        </a>
    </div>

</div>

<footer>
    © 2026 AXTONY - Seu catálogo de desenhos favoritos.
</footer>
</body>
</html>
