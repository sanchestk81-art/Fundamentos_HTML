<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanches</title>

    <!-- Ícone que aparece na aba do navegador -->
    <link rel="icon" type="image/png" href="Foto.png.jpg">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap" rel="stylesheet">

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ff8000;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bio {
            background-color: #ffffff;
            width: 600px;
            min-height: 700px;
            padding: 30px;
            border: 2px solid black;
            border-radius: 20px;

            text-align: center;
        }

        h1 {
            color: #47c7fc;
            font-family: "Sekuya", serif;
            margin-bottom: 20px;
        }

        h2 {
            color: #47c7fc;
            font-family: "Sekuya", serif;
            margin: 25px 0 10px;
        }

        p {
            color: rgb(149, 97, 211);
            text-align: center;
            padding: 15px;
            font-size: 18px;
        }

        /* Foto de perfil */
        .foto {
            width: 200px;
            height: 250px;
            object-fit: cover;
            border-radius: 10%;
            display: block;
            margin: 0 auto;
        }

        /* Listas */
        ul {
            list-style-position: inside;
            text-align: center;
            margin-bottom: 10px;
        }

        li {
            padding: 5px;
            color: #333333;
        }

        /* Ícones */
        .logos {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 15px 10px;
        }

        a {
            text-decoration: underline;
            text-decoration-color: #ff8000;
            text-color: #47c7fc;
        }
    </style>
</head>

<body>

    <div class="bio">

        <h1>Olá, sou sanches</h1>

        <img class="foto" src="Foto.png.jpg" alt="Foto de perfil">

        <p>

            e faço curso técnico de DEV.
        </p>

        <h2>MINHAS QUALIDADES</h2>

            <a href="https://youtube.com/playlist?list=PLkf9CTVw9uBwekLPOhEHFCB4H5ja5RCxZ&si=nbBobC0nuc22Bj-t" target="_blank">escutar musica</a><br>
        </ul>


        <div>

            </a>
